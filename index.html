<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a session</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<style id="pal"></style>

<div class="sw" role="region" aria-label="Prototype controls">
  <div class="sw-in">
    <div class="sw-t"><b>Practice prototype</b><small>Example data. Nothing is sent or shared.</small></div>
    <div class="sw-c">
      <div class="seg" role="group" aria-label="Window"><button type="button" data-a="view" data-v="client">Client</button><button type="button" data-a="view" data-v="therapist">Therapist</button></div>
      <div class="seg" role="group" aria-label="Device"><button type="button" data-a="device" data-v="desktop">Desktop</button><button type="button" data-a="device" data-v="phone">Phone</button></div>
      <button type="button" class="linkbtn" data-a="reset">Reset demo</button>
    </div>
  </div>
</div>
<div class="livebar" id="livebar" hidden><span>Prototype · example data, nothing is sent</span><button type="button" class="linkbtn" data-a="reset" id="livereset" hidden style="padding:0;font-size:12px">Reset demo</button></div>
<main class="stage" id="stage"></main>
<div id="toast" class="toast" hidden role="status"></div>
<script>window.APP_SIDE='client'</script>
<script src="app.js"></script>
</body>
</html>
