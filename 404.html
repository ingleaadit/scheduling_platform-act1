<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F1EFE9;--text:#1B2A22;--muted:#56625A;--accent:#3A5A40;--on:#F1EFE9}
@media (prefers-color-scheme:dark){:root{--bg:#1D201E;--text:#F1EFE9;--muted:#B5B9B3;--accent:#EAE0D5;--on:#1D201E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px}
h1{font-size:34px;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
p{margin:0 0 22px;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--on);text-decoration:none;font-weight:600}
a.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>That page isn’t here</h1>
<p>The link may be old or mistyped. If you were trying to book a session, ask your therapist to send the booking link again.</p>
<a class="btn" href="/">Go to the start</a>
</main>
</body>
</html>
