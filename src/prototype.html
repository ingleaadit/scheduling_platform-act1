<title>Practice Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a sticky switcher bar picks Client or Therapist and Desktop or Phone; the stage below shows that one window — a browser window or a phone — in the Earthy Forest palette: forest green on warm stone neutrals, DM Sans, squarer corners. */
:root{
  --canvas:#CBC8BD; --bg:#DAD7CD; --panel:#E3E0D7; --card:#ECEAE3; --text:#233A2E; --text2:#3A5A40; --line:#C6C3B7;
  --accent:#3A5A40; --accent-ink:#F1EFE9; --accent-hover:#344E41; --soft:#D8DBCD;
  --warn:#8A4500; --warn-bg:#F3DDB8; --warn-ink:#7A3D00; --err:#A8182A; --err-bg:#F3D5D3;
  --bezel:#233A2E; --chrome:#CFCCC1; --shadow:0 24px 70px rgba(35,58,46,.18); --scrim:rgba(20,30,26,.42);
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:"DM Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#121A15; --bg:#18211B; --panel:#1F2A23; --card:#25322A; --text:#E9EBE3; --text2:#A3B18A; --line:#3A4A3F;
  --accent:#A3B18A; --accent-ink:#14201A; --accent-hover:#B7C3A0; --soft:#2C3D31;
  --warn:#F0A65A; --warn-bg:#3A2A17; --warn-ink:#F3C08A; --err:#FF7383; --err-bg:#3A1C21;
  --bezel:#3A4A3F; --chrome:#1B251F; --shadow:0 24px 70px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#121A15; --bg:#18211B; --panel:#1F2A23; --card:#25322A; --text:#E9EBE3; --text2:#A3B18A; --line:#3A4A3F;
  --accent:#A3B18A; --accent-ink:#14201A; --accent-hover:#B7C3A0; --soft:#2C3D31;
  --warn:#F0A65A; --warn-bg:#3A2A17; --warn-ink:#F3C08A; --err:#FF7383; --err-bg:#3A1C21;
  --bezel:#3A4A3F; --chrome:#1B251F; --shadow:0 24px 70px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark}
:root{--lb-blue:#DCE8FB;--lb-blue-i:#1A4A9C;--lb-yel:#FBEFC4;--lb-yel-i:#6E4D00;--lb-grn:#DCF0E1;--lb-grn-i:#1D6532;--lb-red:#FBE0DE;--lb-red-i:#A3231B;--lb-pur:#ECE1F7;--lb-pur-i:#5A2B8C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lb-blue:#1B2B45;--lb-blue-i:#9CC0FF;--lb-yel:#3A3015;--lb-yel-i:#F2D27A;--lb-grn:#173322;--lb-grn-i:#8FD6A4;--lb-red:#3D1A18;--lb-red-i:#FF9D94;--lb-pur:#2D2140;--lb-pur-i:#CDB0F2}}
:root[data-theme="dark"]{--lb-blue:#1B2B45;--lb-blue-i:#9CC0FF;--lb-yel:#3A3015;--lb-yel-i:#F2D27A;--lb-grn:#173322;--lb-grn-i:#8FD6A4;--lb-red:#3D1A18;--lb-red-i:#FF9D94;--lb-pur:#2D2140;--lb-pur-i:#CDB0F2}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.muted{color:var(--text2)}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.025em;text-wrap:balance;margin:0;color:var(--head,inherit)}
.auth-brand h2{color:inherit}

/* switcher */
.sw{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.sw-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.sw-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.sw-t b{font-size:15px;font-weight:600}
.sw-t small{font-size:12px;color:var(--text2)}
.sw-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel);gap:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:10px;font-size:14px;color:var(--text2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.linkbtn{border:0;background:none;color:var(--accent);font-size:14px;padding:6px 4px}

/* stage + frames */
.stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:flex;justify-content:center}
.win{container-type:inline-size;background:var(--bg);color:var(--text);position:relative}
.win.d{width:100%;max-width:1280px;border-radius:11px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:clip}
.chrome{height:40px;background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
.chrome i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.chrome .url{margin:0 auto;height:26px;min-width:0;max-width:420px;flex:1;border-radius:8px;background:var(--bg);color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 10px}
.phone{width:min(390px,100%);height:min(820px,calc(100dvh - 140px));min-height:620px;border-radius:52px;border:11px solid var(--bezel);box-shadow:var(--shadow);overflow:clip;background:var(--bg)}
.win.m{height:100%;display:flex;flex-direction:column;overflow:hidden}
.sbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.sbar .isl{width:96px;height:26px;border-radius:10px;background:var(--bezel)}
.scr{flex:1;overflow:auto;overscroll-behavior:contain}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 24px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--accent-hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn2{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:16px;font-weight:500;white-space:nowrap;text-decoration:none}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:0;background:var(--panel);color:var(--accent);font-size:14px;white-space:nowrap;text-decoration:none}
.mini.w{background:var(--card)}
.mini.pri{background:var(--accent);color:var(--accent-ink)}
.mini.warn{background:var(--warn-bg);color:var(--warn-ink)}
.mini.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--panel);font-size:15px;color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f .ql{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--text2)}
.req{color:var(--err)}
.in{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font-size:16px;background:var(--card);color:var(--text)}
textarea.in{height:auto;min-height:110px;padding:12px 14px;line-height:1.45;resize:vertical}
select.in{appearance:auto}
.in.sm{height:40px;font-size:15px;border-radius:12px;padding:0 10px}
.f.bad .in{border-color:var(--err)}
.err{font-size:13px;color:var(--err)}
.pre{display:flex;gap:8px}
.pre>span{display:grid;place-items:center;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.panel{background:var(--panel);border-radius:16px;padding:22px 24px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.note{border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.soft{background:var(--soft);color:var(--text)}
.note.err{background:var(--err-bg);color:var(--err)}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel);color:var(--text2)}
.pill.up{background:var(--soft);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--panel);color:var(--text)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;flex:none}
.pill.lb-blue,.ev.lb-blue,.mchip.lb-blue{background:var(--lb-blue);color:var(--lb-blue-i)}
.pill.lb-yel,.ev.lb-yel,.mchip.lb-yel{background:var(--lb-yel);color:var(--lb-yel-i)}
.pill.lb-grn,.ev.lb-grn,.mchip.lb-grn{background:var(--lb-grn);color:var(--lb-grn-i)}
.pill.lb-red,.ev.lb-red,.mchip.lb-red{background:var(--lb-red);color:var(--lb-red-i)}
.pill.lb-pur,.ev.lb-pur,.mchip.lb-pur{background:var(--lb-pur);color:var(--lb-pur-i)}
.pill.lb-acc,.ev.lb-acc,.mchip.lb-acc{background:var(--soft);color:var(--accent)}
.pill.lb-grey,.ev.lb-grey,.mchip.lb-grey{background:var(--panel);color:var(--text2)}
.ev.ev-warn,.mchip.ev-warn{background:var(--warn-bg);color:var(--warn-ink)}
.ev.ev-x,.mchip.ev-x{opacity:.65;text-decoration:line-through}
.ev.lb-grey{border:1px solid var(--line)}
/* notifications + connections */
:root{--lock-a:#233A2E;--lock-b:#588157;--lock-ink:#FFFFFF;--lock-card:rgba(255,255,255,.18)}
.mini svg{width:18px;height:18px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--err);color:var(--bg);font-size:11px;font-weight:700}
.nrow{width:100%;text-align:left;border:0;background:none;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.nrow:last-child{border-bottom:0}
.nrow .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.nrow.read .dot{background:transparent}
.nrow.read b{font-weight:500}
.nrow small{color:var(--text2);font-size:13px;white-space:nowrap}
.nrow p{margin:2px 0 0;color:var(--text2);font-size:14px;line-height:1.45;grid-column:2/-1}
.lock{border-radius:38px;padding:30px 12px 18px;background:linear-gradient(160deg,var(--lock-a),var(--lock-b));color:var(--lock-ink);display:flex;flex-direction:column;gap:8px;max-width:340px;width:100%;margin:0 auto}
.lock .clock{text-align:center;font-size:64px;font-weight:300;font-family:var(--display);line-height:1;letter-spacing:-0.02em}
.lock .ldate{text-align:center;font-size:15px;margin:2px 0 16px;opacity:.9}
.lnote{background:var(--lock-card);backdrop-filter:blur(20px);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:1px 10px;font-size:13px;line-height:1.35}
.lnote .ic{grid-row:span 2;width:34px;height:34px;border-radius:9px;background:var(--lock-ink);color:var(--lock-b);display:grid;place-items:center;font-weight:800;font-size:15px}
.lnote small{opacity:.8;font-size:12px}
.lnote span:not(.ic){grid-column:2/-1}
.lnote .ic{grid-column:1}
.dnote{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:1px 12px;font-size:13px;line-height:1.4;max-width:380px}
.dnote .ic{grid-row:span 3;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.tg:last-child{border-bottom:0}
.tg small{display:block;color:var(--text2);font-size:13px}
input.tgl{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:10px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0}
input.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input.tgl:checked{background:var(--accent)}
input.tgl:checked::after{left:21px}
@media (prefers-reduced-motion:no-preference){input.tgl::after{transition:left .15s}}
.conn{display:flex;gap:14px;align-items:flex-start}
.conn .logo{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--accent);flex:none}
.code{font-family:ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:.2em;background:var(--card);border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center}
.fab{position:absolute;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:var(--shadow);z-index:5;display:grid;place-items:center}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow:last-child{border-bottom:0}
.dayv button.hr{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;cursor:pointer;padding:0}
.dayv button.hr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.dayv .work{pointer-events:none}
/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .ttl2{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0 6px;font-family:var(--display)}
.menu{position:relative;margin-left:auto}
.menu-list{position:absolute;right:0;top:42px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:210px;padding:6px}
.menu-list button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:12px 14px;border-radius:10px;font-size:16px;text-align:left}
.menu-list button:hover{background:var(--panel)}
.menu-list button[aria-checked="true"]::after{content:"✓";font-weight:700;color:var(--accent)}
.dayv{position:relative;background:var(--panel);border-radius:14px;overflow:hidden}
.dayv .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.dayv .hr span{position:absolute;left:10px;top:4px;font-size:12px;color:var(--text2)}
.dayv .work{position:absolute;left:64px;right:0;background:var(--card);opacity:.75}
.dayv .dv{position:absolute;left:72px;right:8px;overflow:hidden}
.dayv .ev{overflow:hidden}
.dayv .now{position:absolute;left:64px;right:0;height:2px;background:var(--err)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{font-size:12px;color:var(--text2);text-align:center;padding:2px 0;font-weight:600}
.mcell{background:var(--panel);border-radius:11px;min-height:112px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mcell.out{opacity:.45}
.mday{border:0;background:none;font-weight:600;font-size:13px;align-self:flex-start;padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.mcell.today .mday{background:var(--accent);color:var(--accent-ink)}
.mchip{border:0;border-radius:8px;padding:3px 6px;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);color:var(--text);width:100%}
.mmore{border:0;background:none;font-size:12px;color:var(--accent);text-align:left;padding:0 4px}
.mcount{display:none}
button.pill{height:34px;padding:0 14px;border:0;font-size:14px;cursor:pointer}
.lpick{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:4px 10px}
.lpick button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.lpick button:last-child{border-bottom:0}
.lpick button[aria-pressed="true"] small::after{content:" · current";font-weight:600}
.lpick small{color:var(--text2);font-size:13px;text-align:right}
.tile{background:var(--panel);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile small{font-size:13px;color:var(--text2)}
.tile b{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile.warn b{color:var(--warn)}
.track{height:10px;border-radius:10px;background:var(--card);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--accent)}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:0;flex:none}
.h2{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.sec{display:flex;flex-direction:column;gap:14px}

/* client */
.cnav{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(20px,5cqi,80px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;background:none;border:0;padding:0;min-width:0}
.cwrap{padding:36px clamp(20px,8cqi,140px) 56px;display:flex;flex-direction:column;gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,0.8fr);gap:48px;align-items:center}
.portrait{aspect-ratio:4/5;max-width:100%;border-radius:32px;background:radial-gradient(120% 80% at 30% 20%,var(--soft),var(--panel) 60%,var(--line));display:grid;place-items:center;position:relative;overflow:hidden}
.portrait span{font-family:var(--display);font-size:clamp(64px,10cqi,120px);font-weight:700;color:var(--accent);letter-spacing:-0.04em;opacity:.85}
.portrait small{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--text2)}
.portrait.photo{background:#fff;border:1px solid var(--line)}
.portrait.photo img{width:100%;height:100%;object-fit:contain;display:block}
.kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.type{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.type b{font-size:17px}
.type .price{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.type.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
details.faq{border-bottom:1px solid var(--line);padding:14px 0}
details.faq summary{font-weight:600;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{margin:10px 0 0;color:var(--text2);line-height:1.55;max-width:64ch}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:13px;color:var(--text2)}
.steps span{display:flex;flex-direction:column;gap:8px}
.steps span::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps span.on{color:var(--text);font-weight:600}

function getPath(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function setPath(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){o=o[ks[i]];if(o==null)return}o[ks[ks.length-1]]=v}

/* availability */
function busy(dayT){const out=[];D().appts.forEach(a=>{if(a.status==='upcoming'&&dayStart(a.start)===dayT&&a.id!==S.c.resched)out.push([a.start,a.start+a.dur*6e4,1])});D().blocks.forEach(b=>{if(b.date===dayT)out.push([at(dayT,b.from),at(dayT,b.to)])});if(D().connect.gcal.busy)gBusy().forEach(b=>{if(b.date===dayT)out.push([at(dayT,b.from),at(dayT,b.to)])});return out}
const gapMin=()=>parseInt(D().settings.gapL)||0;
function gBusy(){if(!D().connect.gcal.on)return [];const mk=(off,f,t)=>{const d=new Date(T0);d.setDate(d.getDate()+off);return {date:d.getTime(),from:f,to:t,note:'Google Calendar · busy',g:true}};return [mk(1,'15:00','16:00'),mk(2,'10:00','11:00'),mk(4,'17:00','18:00'),mk(8,'12:00','13:00'),mk(-2,'11:00','12:00')]}
const allBlocks=d=>D().blocks.filter(x=>x.date===d).concat(gBusy().filter(x=>x.date===d));
function slotsFor(dayT,dur){const wd=new Date(dayT).getDay(),res=[],soon=Date.now()+3*36e5,bz=busy(dayT);(D().hours[wd]||[]).forEach(([f,t])=>{let s=at(dayT,f);const end=at(dayT,t);while(s+dur*6e4<=end){const e=s+dur*6e4;if(s>soon&&!bz.some(([a,b,k])=>{const g=k?gapMin()*6e4:0;return s<b+g&&e>a-g}))res.push(s);s+=60*6e4}});return res}
const days=()=>Array.from({length:14},(_,i)=>T0+i*DAY);
function nextFree(typeId,count){const dur=typeOf(typeId).min,out=[];for(const d of Array.from({length:21},(_,i)=>T0+i*DAY)){for(const s of slotsFor(d,dur)){out.push(s);if(out.length>=count)return out}}return out}

/* money and stats */
function due(a){if(a.paid)return 0;if(a.status==='held')return a.fee;if((a.status==='noshow'||a.status==='cancelled')&&a.lateFee&&!a.waived)return a.lateFee;return 0}
function feeLabel(a){if(a.status==='upcoming')return money(a.fee);if(a.status==='held')return a.paid?'Paid':money(a.fee)+' due';if(a.lateFee){if(a.waived)return 'Fee waived';return a.paid?'Fee paid':money(a.lateFee)+' due'}return 'No fee'}
const LABELS=[
  {id:'noresp',name:'No response',cls:'lb-blue',hint:'Not confirmed yet'},
  {id:'confirmed',name:'Confirmed',cls:'lb-yel',hint:'Client said yes'},
  {id:'checkedin',name:'Checked in',cls:'lb-grn',hint:'Client has joined'},
  {id:'completed',name:'Completed',cls:'lb-acc',hint:'Counts as held; fee due'},
  {id:'noshow',name:'No-show',cls:'lb-red',hint:'Full fee due'},
  {id:'cancelled',name:'Cancelled',cls:'lb-grey',hint:'Asks for a reason'},
  {id:'terminated',name:'Terminated',cls:'lb-pur',hint:'Final session; therapy ended'}];
const lbl=id=>LABELS.find(l=>l.id===id);
function labelOf(a){if(a.status==='held')return a.ended?'terminated':'completed';if(a.status==='noshow')return 'noshow';if(a.status==='cancelled')return 'cancelled';return a.label||null}
function needsLabel(a){return a.status==='upcoming'&&a.start+a.dur*6e4<Date.now()}
function labelName(a){const id=labelOf(a);if(needsLabel(a)&&id!=='checkedin')return 'Needs a label';if(!id)return a.isNew?'New booking':'No label';return id==='cancelled'&&a.late?'Late cancel':lbl(id).name}
function pill(a){const id=labelOf(a);if(needsLabel(a)&&id!=='checkedin')return '<span class="pill warn"><i></i>Needs a label</span>';if(!id)return a.isNew?'<span class="pill up"><i></i>New booking</span>':'<span class="pill lb-grey"><i></i>No label</span>';return `<span class="pill ${lbl(id).cls}"><i></i>${labelName(a)}</span>`}
function applyLabel(x,v){const wasHeld=x.status==='held';
  if(!v||v==='noresp'||v==='confirmed'||v==='checkedin'){if(x.status!=='upcoming'){x.status='upcoming';x.lateFee=0;x.late=false;x.reason='';x.waived=false;x.paid=false}x.label=v||null;x.ended=false;if(v)x.isNew=false}
  else if(v==='completed'||v==='terminated'){if(!wasHeld)x.paid=false;x.status='held';x.lateFee=0;x.late=false;x.reason='';x.waived=false;x.ended=v==='terminated';x.label=null;x.isNew=false}
  else if(v==='noshow'){x.status='noshow';x.lateFee=x.fee;x.paid=false;x.reason=x.reason&&x.reason!=='No-show'?x.reason:'No-show';x.ended=false;x.label=null;x.isNew=false}}
function byClient(){const m={};D().appts.forEach(a=>{(m[a.name]=m[a.name]||[]).push(a)});return m}
function dropoffs(){const out=[];Object.entries(byClient()).forEach(([n,list])=>{const held=list.filter(a=>a.status==='held');const up=list.some(a=>a.status==='upcoming');if(held.length===1&&!up&&held[0].start<T0-14*DAY&&list.length===1&&!held[0].ended&&!D().checked[n])out.push({name:n,at:held[0].start,wa:held[0].wa})});return out.sort((a,b)=>a.at-b.at)}

/* form partials */
function field(id,label,path,o){o=o||{};const v=getPath(path);const err=o.err||'';const req=o.req!==false;
  const input=o.type==='long'?`<textarea class="in" id="${id}" data-f="${path}" ${req?'aria-required="true"':''} placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`
   :`<input class="in" id="${id}" type="${o.type==='number'?'number':o.type||'text'}" ${o.mode?`inputmode="${o.mode}"`:''} ${o.live?'data-live="1"':''} data-f="${path}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${req?'aria-required="true"':''} ${o.style?`style="${o.style}"`:''} autocomplete="${o.ac||'off'}">`;
  return `<div class="f${err?' bad':''}"><label for="${id}">${esc(label)}${req?' <span class="req" aria-hidden="true">*</span>':''}</label>${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}${o.pre?`<div class="pre"><span>${o.pre}</span>${input}</div>`:input}${err?`<span class="err">${esc(err)}</span>`:''}</div>`}
function chips(path,opts,label,o){o=o||{};const cur=getPath(path);return `<div class="f${o.err?' bad':''}" role="group" aria-label="${esc(label)}"><span class="ql">${esc(label)}${o.req?' <span class="req" aria-hidden="true">*</span>':''}</span><div class="chips">${opts.map(x=>`<button type="button" class="chip${x===cur?' on':''}" aria-pressed="${x===cur}" data-a="set" data-k="${path}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>${o.err?`<span class="err">${esc(o.err)}</span>`:''}</div>`}
const crisis=()=>`<p class="muted" style="margin:0;font-size:13px;line-height:1.5">In crisis or thinking of harming yourself? Call Tele-MANAS on <b>14416</b>, free and open 24 hours, or go to your nearest hospital.</p>`;

  if(c.day==null||!slotsFor(c.day,ty.min).length){const f=ds.find(d=>slotsFor(d,ty.min).length);c.day=f==null?ds[0]:f}
  const sl=slotsFor(c.day,ty.min);
  return `<div class="sec"><span class="ql" style="font-size:14px;font-weight:600">Session</span><div class="chips">${D().types.filter(t=>!c.resched||t.id===c.type).map(t=>`<button class="chip${t.id===c.type?' on':''}" aria-pressed="${t.id===c.type}" data-a="pickType" data-v="${t.id}">${esc(t.name)} · ${t.min} min</button>`).join('')}</div></div>
  ${c.resched?'':chips('c.mode',['Online','In person'],'How you’d like to meet')}
  <div class="sec"><span style="font-size:14px;font-weight:600">${new Date(c.day).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span>
  <div class="dates" role="group" aria-label="Day">${ds.map(d=>{const n=slotsFor(d,ty.min).length;const dt=new Date(d);return `<button class="date${d===c.day?' on':''}" ${n?'':'disabled'} aria-pressed="${d===c.day}" data-a="pickDay" data-v="${d}" aria-label="${esc(fDL(d))}, ${n} times"><span>${dt.toLocaleDateString('en-IN',{weekday:'short'})}</span><b>${dt.getDate()}</b><span>${n?n+' free':'Full'}</span></button>`}).join('')}</div></div>
  <div class="sec"><span style="font-size:14px;font-weight:600">${esc(fDL(c.day))}</span>${sl.length?`<div class="slots" role="group" aria-label="Times">${sl.map(s=>`<button class="slot${s===c.slot?' on':''}" aria-pressed="${s===c.slot}" data-a="pickSlot" data-v="${s}">${fT(s)}</button>`).join('')}</div>`:'<p class="muted" style="margin:0">No times left on this day.</p>'}
  <p class="muted" style="margin:0;font-size:13px">Times shown in India Standard Time.</p></div>
  ${c.resched||!paid()?'':`<div class="note soft" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><b>None of these work?</b><br><span class="muted">Join the waitlist and get a WhatsApp message when a time you want opens up.</span></span><button class="mini w" data-a="go" data-v="waitlist">Join the waitlist</button></div>`}`}

function vConfirm(){const c=S.c,ty=typeOf(c.type);return `${c.fail?`<div class="note warn" role="alert"><b>This booking did not go through.</b><br>${esc(c.fail)}</div>`:''}<div class="card sec" style="gap:8px"><b style="font-size:17px">${esc(ty.name)} with ${esc(P().name)}</b><span>${esc(fDL(c.slot))}, ${fT(c.slot)} · ${ty.min} min · ${money(ty.fee)}</span><span class="muted" style="font-size:14px">For ${esc(c.d.fn+' '+c.d.ln)} · +91 ${esc(c.d.wa)}</span></div>
  ${!needIntake()?`<p class="muted" style="margin:0;font-size:15px;line-height:1.5">You can cancel or move this session for free up to ${D().settings.cancelWindow} hours before it starts. After that, ${D().settings.latePct}% of the fee applies.</p>`:`<div class="sec" style="gap:10px"><h2 class="h2" style="font-size:20px">Informed consent and cancellation policy</h2><div class="policy" tabindex="0" aria-label="Policy text">${policyHtml()}</div>
  <label class="check" for="agree"><input type="checkbox" id="agree" data-f="c.agree" ${c.agree?'checked':''}><span>I have read and agree to the terms and conditions. <span class="req" aria-hidden="true">*</span></span></label>${c.err.agree?`<span class="err">${esc(c.err.agree)}</span>`:''}</div>`}`}
function policyHtml(){return pol(D().consent).split(/\n\n+/).map(b=>{const lines=b.split('\n');let h='';if(lines[0].startsWith('## ')){h=`<h4>${esc(lines.shift().slice(3))}</h4>`}return h+(lines.length?`<p>${esc(lines.join(' '))}</p>`:'')}).join('')}

function vBooked(){const a=D().appts.find(x=>x.id===S.c.booked);if(!a)return '<p>Booking not found.</p>';const ty=typeOf(a.type);const c=S.c;const s=D().settings;
  const lateNow=a.start-Date.now()<s.cancelWindow*36e5;
  if(a.status==='cancelled')return `<div class="sec" style="max-width:640px"><h1 style="font-size:34px">Session cancelled</h1><p class="muted" style="margin:0;font-size:17px;line-height:1.5">${esc(fDL(a.start))}, ${fT(a.start)} is cancelled. ${a.lateFee?`A late cancellation fee of ${money(a.lateFee)} applies, as in the policy.`:'No fee applies.'}</p><div><button class="btn" data-a="startBook">Book another time</button></div></div>`;
  return `<div class="sec" style="max-width:680px;gap:18px"><span class="av" style="width:56px;height:56px;font-size:26px">✓</span><h1 style="font-size:${S.device==='phone'?'32px':'40px'}">You’re booked, ${esc(firstName(a.name))}</h1>
  <p class="muted" style="margin:0;font-size:17px;line-height:1.5">${SLUG?(a.mail==='sent'?`A confirmation email is on its way to ${esc(a.email)}. It has a private link to move or cancel this session.`:`${esc(tName(true))} has your booking and will be in touch to confirm.`):`${esc(firstName(P().name))} will confirm on WhatsApp and send a reminder the day before.`}${a.guardian?' She will also contact your parent or guardian for consent.':''}</p>
  <div class="card"><dl class="kv"><dt>Session</dt><dd>${esc(ty.name)}, ${ty.min} min</dd><dt>When</dt><dd>${esc(fDL(a.start))}, ${fT(a.start)}</dd><dt>Where</dt><dd>${videoFor(a)?`Online. Video link: <a href="https://${videoFor(a)}" target="_blank" rel="noopener">${esc(videoFor(a))}</a>`:SLUG&&a.mode!=='In person'?`Online. ${esc(tName(true))} will send the video link before the session.`:esc(P().where.replace(/^Online, and in person in /,''))}</dd><dt>Fee</dt><dd>${money(a.fee)}${SLUG&&s.upi?'. You can pay now (below) or after the session.':', by UPI after the session.'}${SLUG?'':' A payment link comes on WhatsApp.'}</dd>${a.wa?`<dt>WhatsApp</dt><dd>${esc(a.wa)}</dd>`:''}</dl></div>
  ${SLUG&&a.status==='upcoming'&&(S.mg||{})[a.id]?attendBox(a,c,lateNow):''}
  ${SLUG&&s.upi&&a.status==='upcoming'?payBox(a,s):''}
  ${SLUG&&!(S.mg||{})[a.id]?`<p class="muted" style="margin:0;font-size:14px">To change or cancel, ${a.mail==='sent'?'reply to the confirmation email':'contact '+esc(tName())}. ${lateNow?`It starts in less than ${s.cancelWindow} hours, so cancelling now costs ${s.latePct}% of the fee.`:`It is free until ${esc(fD(a.start-s.cancelWindow*36e5))}, ${fT(a.start-s.cancelWindow*36e5)}.`}</p>`:c.cancelAsk?`<div class="panel sec"><b>Cancel this session?</b>${lateNow?`<div class="note warn">It starts in less than ${s.cancelWindow} hours, so a fee of ${money(Math.round(a.fee*s.latePct/100))} applies.</div>`:'<span class="muted">No fee applies.</span>'}
    ${chips('c.cancelReason',REASONS,'Reason, optional')}<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="clientCancel">Cancel session</button><button class="btn2" data-a="set" data-k="c.cancelAsk" data-v="">Keep it</button></div></div>`
  :`<div style="display:flex;gap:10px;flex-wrap:wrap">${SLUG&&lateNow?'':'<button class="btn2" data-a="resched">Reschedule</button>'}<button class="btn2" data-a="set" data-k="c.cancelAsk" data-v="1">Cancel</button></div>
    <p class="muted" style="margin:0;font-size:13px">${lateNow?`It starts in less than ${s.cancelWindow} hours, so cancelling now costs ${s.latePct}% of the fee, and it can’t be moved online.`:`Free to cancel or move until ${esc(fD(a.start-s.cancelWindow*36e5))}, ${fT(a.start-s.cancelWindow*36e5)}.`}</p>`}
  ${LIVE?'':'<p class="muted" style="margin:0;font-size:13px">Switch to the Therapist window to see this booking arrive.</p>'}</div>`}

/* The reminder email's question. It only tells the therapist; it never cancels or moves the session. */
function attendBox(a,c,lateNow){if(a.attend==='yes')return `<div class="note"><b>Thank you.</b><br>${esc(tName(true))} knows you will be there.</div>`;
  if(a.attend==='no')return `<div class="note warn"><b>${esc(tName(true))} has been told you can’t make it.</b><br>${lateNow?'Because the session is close, it can’t be moved online. They will contact you to rearrange.':'Pick a new time with Reschedule below, or they will contact you.'}</div>`;
  if(!c.ask)return '';
  return `<div class="panel sec" style="gap:10px"><b style="font-size:18px">Will you be there at ${fT(a.start)}?</b><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" data-a="attend" data-v="yes">Yes, I’ll be there</button><button type="button" class="btn2" data-a="attend" data-v="no">I can’t make it</button></div></div>`}
/* Pay by UPI straight to the therapist. There is no payment company in between: the client pays from their own UPI app, then can tap once to tell the therapist. */
function payBox(a,s){if(a.claimed)return `<div class="note"><b>Thank you.</b><br>${esc(tName(true))} will mark this paid once it shows in their account.</div>`;
  const link='upi://pay?pa='+encodeURIComponent(s.upi)+'&pn='+encodeURIComponent(P().name&&P().name!=='Your name'?P().name:'Therapist')+'&am='+encodeURIComponent(a.fee)+'&cu=INR&tn='+encodeURIComponent('Session '+fD(a.start));
  return `<div class="card sec" style="gap:12px;max-width:680px"><b style="font-size:17px">Pay ${money(a.fee)} now by UPI</b>
    <span class="muted" style="font-size:14px;line-height:1.5">Optional. You can also pay after the session. The money goes straight to ${esc(tName())}.</span>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><code id="upiid" style="font-size:16px;word-break:break-all">${esc(s.upi)}</code><button type="button" class="mini" data-a="copy" data-src="upiid">Copy UPI ID</button></div>
    <div><a class="btn" href="${esc(link)}" style="text-decoration:none;display:inline-flex;align-items:center">Open my UPI app</a></div>
    <span class="muted" style="font-size:13px;line-height:1.5">On a phone this opens your UPI app with the amount filled in. On a computer, copy the UPI ID and pay from your phone.</span>
    ${(S.mg||{})[a.id]?`<div class="sec" style="gap:6px"><div><button type="button" class="btn2" data-a="payClaim">I have paid</button></div><span class="muted" style="font-size:13px;line-height:1.5">One tap. It only tells ${esc(tName())}; they mark it paid once it reaches their account.</span></div>`:''}</div>`}
function vWaitlist(){const w=S.c.wl,e=S.c.err;if(S.c.wlDone)return `<div class="sec" style="max-width:620px"><span class="av" style="width:56px;height:56px;font-size:26px">✓</span><h1 style="font-size:34px">You’re on the waitlist</h1><p class="muted" style="margin:0;font-size:17px;line-height:1.5">When a ${esc(w.days.toLowerCase())} slot in the ${esc(w.times.toLowerCase())} opens, you’ll get a WhatsApp message. Reply STOP at any time to leave.</p><div><button class="btn2" data-a="go" data-v="intro">Back to ${esc(firstName(P().name))}’s page</button></div></div>`;
  return `<div class="sec" style="gap:18px;max-width:680px"><p class="muted" style="margin:0;font-size:17px;line-height:1.5">When a session frees up at a time that suits you, you get a WhatsApp message with the time. Take it or let it pass.</p>
  <div class="grid2">${field('wfn','First name','c.wl.fn',{err:e.fn})}${field('wln','Last name','c.wl.ln',{err:e.ln})}</div>
  ${field('wwa','WhatsApp number','c.wl.wa',{type:'tel',mode:'numeric',pre:'+91',err:e.wa})}
  ${chips('c.wl.days',['Weekdays','Saturdays','Any day'],'Days that suit you')}
  ${chips('c.wl.times',['Mornings','Afternoons','Evenings after 6','Any time'],'Times that suit you')}
  ${chips('c.wl.type',D().types.map(t=>t.id),'Session').replace(/>(first|follow|reduced)</g,(m0,id)=>'>'+esc(typeOf(id).name)+'<')}
  <p class="muted" style="margin:0;font-size:13px">Offers go out in the order people joined.</p></div>`}

function doneRows(){const c=S.c,n=stepNo(c.step),ty=typeOf(c.type),rows=[];if(c.resched)return '';
  if(n>1&&c.slot)rows.push(['time','Time',`${esc(ty.name)} · ${esc(fD(c.slot))}, ${fT(c.slot)}`]);
  if(n>2)rows.push(['details','Your details',`${esc(c.d.fn+' '+c.d.ln)} · +91 ${esc(c.d.wa)}`]);
  if(n>3&&needIntake())rows.push(['about','About you','Answered']);
  return rows.length?`<div class="donerows">${rows.map(([k,l,v])=>`<div class="donerow"><span><small>${l}</small><b>${v}</b></span><button type="button" class="linkbtn" style="padding:0 4px;min-height:44px" data-a="go" data-v="${k}">Change</button></div>`).join('')}</div>`:''}
const TITLES={time:'Pick a time',details:'Your details',about:'Client information',confirm:'Confirm your booking',booked:'Booked',waitlist:'Join the waitlist'};
function clientDesk(){const c=S.c,st=c.step;
  const nav=`<header class="cnav"><button class="brand" data-a="go" data-v="intro"><span class="av">${ini()}</span><span>${esc(P().name)}</span></button>${st==='intro'?'<button class="btn" data-a="startBook" style="height:40px;padding:0 18px;font-size:15px">Book a session</button>':'<span class="muted" style="font-size:14px">Book a session</span>'}</header>`;
  let body='';
  if(st==='intro')body=vIntro(false);
  else if(st==='booked'||st==='waitlist'){body=`<div class="cwrap">${st==='waitlist'&&!c.wlDone?`<button class="linkbtn" style="align-self:flex-start;padding:0" data-a="back">← Back to times</button><h1 style="font-size:40px">Join ${esc(firstName(P().name))}’s waitlist</h1>`:''}${st==='booked'?vBooked():vWaitlist()}${st==='waitlist'&&!c.wlDone?'<div><button class="btn" data-a="joinWl">Join the waitlist</button></div>':''}</div>`}
  else{const n=stepNo(st),nb=nextBtn();const content=st==='time'?vTime():st==='details'?vDetails():st==='about'?vAbout():vConfirm();
    body=`<div class="cwrap"><div class="steps" aria-label="Progress">${stepKeys().map(k=>stepLabel[k]).map((l,i)=>`<span class="${i+1===n?'on':i+1<n?'past':''}" ${i+1===n?'aria-current="step"':''}>${i+1} · ${l}</span>`).join('')}</div>
    <div class="split"><form class="sec" style="gap:20px" data-form="${st}" novalidate><button type="button" class="linkbtn" style="align-self:flex-start;padding:0" data-a="back">← Back</button>${doneRows()}<h1 style="font-size:40px;font-weight:700">${c.resched&&st==='time'?'Pick a new time':TITLES[st]}</h1>${content}
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" data-a="${nb.act}" ${nb.dis?'disabled':''}>${nb.label}</button>${st==='time'&&!c.slot?'<span class="muted" style="font-size:14px">Choose a time to continue</span>':''}</div></form>${summary()}</div></div>`}
  return nav+body+`<footer class="cfoot">${crisis()}</footer>`}

function clientPhone(){const c=S.c,st=c.step;
  if(st==='intro')return `<header class="mtop"><span></span><b>${esc(P().name)}</b><span></span></header><div class="scr">${vIntro(true)}</div><div class="mbar"><button class="btn2" data-a="go" data-v="waitlist" style="height:50px;padding:0 16px">Waitlist</button><button class="btn" data-a="startBook" style="flex:1;height:50px">Book a session</button></div>`;
  if(st==='booked'||st==='waitlist'){const wl=st==='waitlist'&&!c.wlDone;return `<header class="mtop"><button data-a="${wl?'back':'go'}" data-v="intro" aria-label="Back">←</button><b>${wl?'Waitlist':esc(P().name)}</b><span></span></header><div class="scr"><div class="mbody">${wl?`<h1 style="font-size:30px">Join ${esc(firstName(P().name))}’s waitlist</h1>`:''}${st==='booked'?vBooked():vWaitlist()}</div></div>${wl?'<div class="mbar"><button class="btn full" data-a="joinWl" style="height:50px">Join the waitlist</button></div>':''}`}
  const n=stepNo(st),nb=nextBtn();const content=st==='time'?vTime():st==='details'?vDetails():st==='about'?vAbout():vConfirm();
  const ty=typeOf(c.type);const NS=stepKeys().length;
  return `<header class="mtop"><button data-a="back" aria-label="Back">←</button><b>Book a session</b><span></span></header><div class="prog" aria-label="Step ${n} of ${NS}">${stepKeys().map((k,j)=>j+1).map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>
  <div class="scr"><form class="mbody" data-form="${st}" novalidate>${doneRows()}<div><p class="muted" style="margin:0 0 4px;font-size:13px">Step ${n} of ${NS}</p><h1 style="font-size:30px;font-weight:700">${c.resched&&st==='time'?'Pick a new time':TITLES[st]}</h1></div>${content}</form></div>
  <div class="mbar"><span>${c.slot?`<b style="font-size:15px">${esc(fD(c.slot))}, ${fT(c.slot)}</b><br><span class="muted">${esc(ty.name)} · ${money(ty.fee)}</span>`:`<span class="muted">${esc(ty.name)} · ${money(ty.fee)}</span>`}</span><button class="btn" data-a="${nb.act}" ${nb.dis?'disabled':''} style="height:50px;padding:0 20px">${st==='confirm'?'Confirm':nb.label}</button></div>`}

/* client validation */
function hasAge(){return D().intake.some(q=>q.id==='age')}
function minor(){const v=S.c.a.age;const n=Number(v);return hasAge()&&v!==''&&v!=null&&n>0&&n<18}
function valDetails(){const d=S.c.d,e={};if(!d.fn.trim())e.fn='Enter your first name';if(!d.ln.trim())e.ln='Enter your last name';if(!/^\S+@\S+\.\S+$/.test(d.email.trim()))e.email='Enter an email like name@example.com';if(d.wa.replace(/\D/g,'').length!==10)e.wa='Enter a 10-digit number, without +91';return e}
function valAbout(){const e={},s=D().settings;D().intake.forEach(q=>{const v=String(S.c.a[q.id]==null?'':S.c.a[q.id]).trim();if(q.req&&!v)e[q.id]=q.type==='choice'?'Choose one answer':'Please answer this question'});
  if(hasAge()&&S.c.a.age!==''){const a=Number(S.c.a.age);if(!(a>=5&&a<=110))e.age='Enter your age in years'}
  if(minor()){if(!s.minors)e.age='Bookings are for clients aged 18 and over';else{if(!S.c.g.name.trim())e.gname='Enter their name';if(!S.c.g.rel.trim())e.grel='Say how they are related to you';if(S.c.g.wa.replace(/\D/g,'').length!==10)e.gwa='Enter a 10-digit number'}}return e}

/* ------------- sign-in ------------- */
function signIn(m){const L=S.login;const real=!!SB;
  const form=`<form class="auth-form" data-form="login" novalidate ${m?'style="padding:24px 22px 32px;justify-content:flex-start"':''}>
    <div><h1 style="font-size:${m?'30px':'36px'};font-weight:700">${L.mode==='setpw'?'Set your password':'Sign in'}</h1><p class="muted" style="margin:6px 0 0;font-size:16px">${L.mode==='setpw'?'to finish setting up your account':'to your practice console'}</p></div>
    ${real?'':`<button type="button" class="prov" data-a="provider" data-v="Apple"><i aria-hidden="true">A</i>Continue with Apple</button>
    <button type="button" class="prov" data-a="provider" data-v="Google"><i aria-hidden="true">G</i>Continue with Google</button>
    <button type="button" class="prov" data-a="provider" data-v="Facebook"><i aria-hidden="true">f</i>Continue with Facebook</button>`}
    ${L.note?`<div class="note warn" role="status">${esc(L.note)}</div>`:''}
    ${real?'':'<div class="or">or</div>'}
    ${L.mode==='setpw'?`${field('lp','New password','login.pw',{type:'password',req:false,ac:'new-password',hint:'At least 10 characters'})}${field('lp2','Repeat password','login.pw2',{type:'password',req:false,ac:'new-password'})}
      ${L.err?`<span class="err" role="alert">${esc(L.err)}</span>`:''}<button type="submit" class="btn full" ${L.busy?'disabled':''}>${L.busy?'Saving…':'Save password'}</button>`:L.mode==='email'?`${field('le','Email','login.email',{type:'email',req:false,ac:'username',ph:'you@example.com'})}${field('lp','Password','login.pw',{type:'password',req:false,ac:'current-password'})}
      ${L.err?`<span class="err" role="alert">${esc(L.err)}</span>`:''}<button type="submit" class="btn full" ${L.busy?'disabled':''}>${L.busy?'Signing in…':'Sign in'}</button>
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><button type="button" class="linkbtn" style="padding:0" data-a="forgot">Forgot password?</button>${real?'':`<button type="button" class="linkbtn" style="padding:0" data-a="lmode" data-v="phone">Use phone number instead</button>`}</div>`
    :`${field('lph','Mobile number','login.phone',{type:'tel',mode:'numeric',req:false,pre:'+91',ac:'tel-national'})}${L.sent?field('lotp','6-digit code','login.otp',{mode:'numeric',req:false,ac:'one-time-code',hint:'Sent by SMS to +91 '+L.phone}):''}
      ${L.err?`<span class="err" role="alert">${esc(L.err)}</span>`:''}<button type="submit" class="btn full">${L.sent?'Verify and sign in':'Send code'}</button>
      <button type="button" class="linkbtn" style="padding:0;align-self:flex-start" data-a="lmode" data-v="email">Use email and password instead</button>`}
    ${real?'':`<div class="note soft" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><b>Demo login</b><br><span class="muted">${L.mode==='email'?`${DEMO_EMAIL} · ${DEMO_PW}`:`Any 10-digit number · code ${DEMO_OTP}`}</span></span><button type="button" class="mini w" data-a="fillDemo">Fill it in</button></div>`}
    ${real?'<p class="muted" style="margin:0;font-size:13px">Access is by invitation only.</p>':`<p class="muted" style="margin:0;font-size:13px">New to Practice? <button type="button" class="linkbtn" style="padding:0;font-size:13px" data-a="signup">Create an account</button></p>`}
  </form>`;
  if(m)return `<header class="mhead" style="background:var(--accent);color:var(--accent-ink);border:0"><b>Practice</b><span style="font-size:13px">Console</span></header><div class="scr">${form}</div>`;
  return `<div class="auth"><div class="auth-brand"><b style="font-size:18px">Practice</b><div class="sec" style="gap:22px"><h2 style="font-size:clamp(30px,3.6cqi,44px);font-weight:700;line-height:1.1">Your practice, in one place.</h2>
    <ul><li>Bookings, intake and consent from one link</li><li>Waitlist that refills cancelled slots</li><li>Training log for client and supervision hours</li><li>Names hidden on shared screens</li></ul></div><span style="font-size:13px;opacity:.85">${real?'Access is by invitation only.':'Prototype. Sign-in details stay in this browser.'}</span></div>${form}</div>`}

/* ------------- therapist ------------- */
const TABS=[['schedule','Schedule'],['appts','Appointments'],['insights','Insights'],['payments','Payments'],['waitlist','Waitlist'],['log','Training log'],['messages','Messages'],['hours','Hours'],['profile','Profile'],['apps','Connected apps']];
const ICON={schedule:'<path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>',appts:'<path d="M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>',insights:'<path d="M5 19V11M12 19V5M19 19v-6"/>',messages:'<path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v9"/>',more:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',sessions:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',payments:'<path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2ZM3 10h18M7 15h3"/>',settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"/>',bell:'<path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

function freedBanner(){const f=S.t.freed;if(!f||f.start<Date.now())return '';const ty=f.type;const match=D().waitlist.filter(w=>wlMatches(w,f.start));
  return `<div class="note soft" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px"><span><b style="font-size:16px">A slot opened: ${esc(fD(f.start))}, ${fT(f.start)}</b><br><span class="muted">${esc(nm(f.by))} cancelled${f.late?' late':''}. ${match.length?match.length+' on the waitlist want'+(match.length===1?'s':'')+' this time.':'Nobody on the waitlist matches this time.'}</span></span>
  <span class="acts">${match.length?`<button class="mini pri" data-a="offer" data-id="${match[0].id}" data-slot="${f.start}">Offer to ${esc(nm(match[0].name))}</button>`:''}<button class="mini w" data-a="tab" data-v="waitlist">See waitlist</button><button class="mini w" data-a="dismissFreed">Dismiss</button></span></div>`}
function wlMatches(w,t){const d=new Date(t),wd=d.getDay(),h=d.getHours();const dayOk=w.days==='Any day'||(w.days==='Weekdays'&&wd>=1&&wd<=5)||(w.days==='Saturdays'&&wd===6)||(w.days==='Thursdays'&&wd===4);const tOk=w.times==='Any time'||(w.times==='Mornings'&&h<12)||(w.times==='Afternoons'&&h>=12&&h<17)||(w.times==='Evenings after 6'&&h>=18);return dayOk&&tOk}

function arow(a){const ty=typeOf(a.type);return `<button class="arow" data-a="openAp" data-id="${a.id}"><span class="when"><b>${fT(a.start)}</b><small>${esc(fD(a.start))}</small></span><span class="who"><b>${esc(nm(a.name))}</b><small>${esc(ty.name)}${a.source==='Client page'?' · booked online':''}${a.sup&&!a.supDone?' · <b style="color:var(--lb-pur-i);font-weight:600">For supervision</b>':''}</small></span>${pill(a)}<span class="fee">${feeLabel(a)}</span></button>`}

/* calendar views */
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);d.setHours(0,0,0,0);return d.getTime()};
const weekStart=t=>{const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d.getTime()};
const calEvs=d=>D().appts.filter(a=>dayStart(a.start)===d).sort((a,b)=>a.start-b.start);
function evCls(a){const id=labelOf(a);if(needsLabel(a)&&id!=='checkedin')return 'ev-warn';if(!id)return a.isNew?'lb-acc':'';return lbl(id).cls+(id==='cancelled'?' ev-x':'')}
function evBtn(a,style){return `<button class="ev ${evCls(a)}" data-a="openAp" data-id="${a.id}" ${style?`style="${style}"`:''}><b>${fT(a.start)}</b>${esc(nm(a.name))}<span style="display:block;font-size:12px;opacity:.85">${esc(labelName(a))}</span></button>`}
function weekCol(d){const list=calEvs(d),bl=allBlocks(d),dt=new Date(d);
  return `<div class="wday${d===T0?' today':''}"><h4><button class="linkbtn" style="padding:0;font-size:13px;font-weight:600;color:inherit" data-a="calDay" data-v="${d}">${d===T0?'Today':dt.toLocaleDateString('en-IN',{weekday:'short'})} ${dt.getDate()}</button></h4>${list.map(a=>evBtn(a)).join('')}${bl.map(x=>`<div class="ev blk"><b>${hmLabel(x.from)}–${hmLabel(x.to)}</b>${esc(x.note||'Blocked')}</div>`).join('')}${!list.length&&!bl.length?`<span class="muted" style="font-size:13px">${(D().hours[dt.getDay()]||[]).length?'Free':'Not working'}</span>`:''}</div>`}
function dayView(d){const H0=8,H1=21,PX=60;const evs=calEvs(d),bl=allBlocks(d),wh=D().hours[new Date(d).getDay()]||[];
  const ym=t=>{const x=new Date(t);return ((x.getHours()-H0)*60+x.getMinutes())*PX/60};const yhm=hm=>{const [h,m]=hm.split(':').map(Number);return ((h-H0)*60+m)*PX/60};
  const live=evs.filter(a=>a.status!=='cancelled'),gone=evs.filter(a=>a.status==='cancelled');
  return `<div class="dayv" style="height:${(H1-H0)*PX}px" aria-label="${esc(fDL(d))}">${Array.from({length:H1-H0},(_,i)=>`<button class="hr" style="top:${i*PX}px;height:${PX}px" data-a="newAp" data-from="cal" data-day="${d}" data-time="${String(H0+i).padStart(2,'0')}:00" aria-label="New session at ${hmLabel(String(H0+i).padStart(2,'0')+':00')}"><span>${hmLabel(String(H0+i).padStart(2,'0')+':00')}</span></button>`).join('')}
    ${wh.map(([f,t])=>`<div class="work" style="top:${yhm(f)}px;height:${yhm(t)-yhm(f)}px"></div>`).join('')}
    ${bl.map(x=>`<div class="ev blk dv" style="top:${yhm(x.from)}px;height:${yhm(x.to)-yhm(x.from)-4}px"><b>${hmLabel(x.from)}–${hmLabel(x.to)}</b>${esc(x.note||'Blocked')}</div>`).join('')}
    ${gone.map(a=>evBtn(a,`position:absolute;right:8px;width:38%;top:${ym(a.start)}px;height:${Math.max(44,a.dur*PX/60-4)}px`)).join('')}
    ${live.map(a=>evBtn(a,`position:absolute;left:72px;right:${gone.some(g=>g.start<a.start+a.dur*6e4&&a.start<g.start+g.dur*6e4)?'42%':'8px'};top:${ym(a.start)}px;height:${Math.max(44,a.dur*PX/60-4)}px`)).join('')}
    ${d===T0&&new Date().getHours()>=H0&&new Date().getHours()<H1?`<div class="now" style="top:${ym(Date.now())}px" aria-hidden="true"></div>`:''}</div>
    <p class="muted" style="margin:0;font-size:13px">White bands are your working hours. Tap an empty hour to book it. ${evs.length?evs.length+' session'+(evs.length===1?'':'s')+' this day.':'No sessions this day.'}</p>`}
function monthView(d0){const m=new Date(d0);m.setDate(1);const month=m.getMonth();const gs=weekStart(dayStart(m.getTime()));const cells=[];
  for(let i=0;i<42;i++){const d=addDays(gs,i);if(i%7===0&&i>=28&&new Date(d).getMonth()!==month)break;cells.push(d)}
  return `<div class="month">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span class="mh">${x}</span>`).join('')}${cells.map(d=>{const evs=calEvs(d),dt=new Date(d);
    return `<div class="mcell${dt.getMonth()!==month?' out':''}${d===T0?' today':''}"><button class="mday" data-a="calDay" data-v="${d}" aria-label="${esc(fDL(d))}, ${evs.length} sessions">${dt.getDate()}</button>${evs.slice(0,3).map(a=>`<button class="mchip ${evCls(a)}" data-a="openAp" data-id="${a.id}">${fT(a.start)} ${esc(nm(a.name))}</button>`).join('')}${evs.length>3?`<button class="mmore" data-a="calDay" data-v="${d}">+${evs.length-3} more</button>`:''}${evs.length?`<span class="mcount" aria-hidden="true">${evs.length}</span>`:''}</div>`}).join('')}</div>`}
function calendar(){const v=S.t.cal||'week',d0=S.t.calDate||T0;let title,body;
  if(v==='day'){title=fDL(d0);body=dayView(d0)}
  else if(v==='week'){const ws=weekStart(d0),we=addDays(ws,6);title=new Date(ws).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' – '+new Date(we).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});body=`<div class="week">${Array.from({length:7},(_,i)=>weekCol(addDays(ws,i))).join('')}</div>`}
  else{title=new Date(d0).toLocaleDateString('en-IN',{month:'long',year:'numeric'});body=monthView(d0)}
  const names={month:'Month view',week:'Week view',day:'Day view'};
  return `<section class="sec"><div class="calbar"><button class="mini" data-a="calNav" data-v="-1" aria-label="Previous">‹</button><button class="mini" data-a="calNav" data-v="0">Today</button><button class="mini" data-a="calNav" data-v="1" aria-label="Next">›</button><span class="ttl2">${esc(title)}</span>
    <div class="menu"><button class="mini" data-a="calMenu" aria-haspopup="menu" aria-expanded="${!!S.t.calMenu}">${names[v]} ▾</button>${S.t.calMenu?`<div class="menu-list" role="menu">${['month','week','day'].map(k=>`<button role="menuitemradio" aria-checked="${k===v}" data-a="calView" data-v="${k}">${names[k]}</button>`).join('')}</div>`:''}</div><button class="mini pri" data-a="newAp" data-from="cal" aria-label="New session" style="font-size:22px;width:34px;padding:0">+</button></div>${body}${v==='day'?'':''}</section>`}

function tSchedule(){const up=D().appts.filter(a=>a.status==='upcoming').sort((a,b)=>a.start-b.start);const today=up.filter(a=>dayStart(a.start)===T0);
  const totalDue=D().appts.reduce((s,a)=>s+due(a),0);const wk=Array.from({length:7},(_,i)=>T0+i*DAY);const b=S.t.blk;if(!b.date)b.date=String(T0+DAY);
  const h=new Date().getHours();const hello=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  return `<div class="ttl"><div><p class="muted" style="margin:0 0 2px;font-size:14px">${esc(fDL(T0))}</p><h1>${hello}</h1><p>${today.length?today.length+' session'+(today.length>1?'s':'')+' today':'No sessions today'} · ${up.length} coming up · ${money(totalDue)} due</p></div></div>
  ${todoQueue()}
  ${(()=>{const n=0;return n?`<div class="note warn" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><b>${n} past session${n===1?' needs':'s need'} a label.</b> Mark them Completed, No-show or Cancelled.</span><button class="mini w" data-a="tab" data-v="insights">Label them</button></div>`:''})()}
  ${(()=>{const n=D().appts.filter(a=>a.status==='upcoming'&&a.start+a.dur*6e4>Date.now()).sort((a,b)=>a.start-b.start)[0];if(!n)return '';const v=videoFor(n);const soon=n.start-Date.now()<15*6e4;
    return `<section class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><span><span class="muted" style="font-size:13px">Next session</span><br><b style="font-size:18px">${esc(nm(n.name))} · ${esc(dayStart(n.start)===T0?'Today':fD(n.start))}, ${fT(n.start)}</b><br><span class="muted" style="font-size:14px">${esc(typeOf(n.type).name)} · ${v?'Online':'In person'}${n.checkin?' · check-in answered':''}</span></span>
    <span class="acts">${v?`<a class="${soon?'btn':'btn2'}" style="height:42px;font-size:15px" href="https://${v}" target="_blank" rel="noopener">Join video</a>`:''}<button class="mini w" data-a="openAp" data-id="${n.id}">Details</button></span></section>`})()}
  ${calendar()}`}
function blockPanel(){const b=S.t.blk;if(!b.date)b.date=String(T0+DAY);return `<section class="panel sec"><h2 class="h2">Block time</h2><p class="muted" style="margin:-6px 0 0;font-size:14px">Blocked times disappear from your booking page straight away.</p>
    <div class="grid4" style="align-items:end"><div class="f"><label for="bd">Day</label><select class="in sm" id="bd" data-f="t.blk.date">${days().map(d=>`<option value="${d}" ${String(d)===String(b.date)?'selected':''}>${esc(fD(d))}</option>`).join('')}</select></div>
    <div class="f"><label for="bf">From</label><select class="in sm" id="bf" data-f="t.blk.from">${TIMES.map(t=>`<option value="${t}" ${t===b.from?'selected':''}>${hmLabel(t)}</option>`).join('')}</select></div>
    <div class="f"><label for="bt">To</label><select class="in sm" id="bt" data-f="t.blk.to">${TIMES.map(t=>`<option value="${t}" ${t===b.to?'selected':''}>${hmLabel(t)}</option>`).join('')}</select></div>
    <div class="f"><label for="bn">Note</label><input class="in sm" id="bn" data-f="t.blk.note" value="${esc(b.note)}" placeholder="Supervision, personal"></div></div>
    <div><button class="mini pri" data-a="addBlock">Block this time</button></div>
    ${D().blocks.length?`<div>${D().blocks.slice().sort((x,y)=>x.date-y.date).map(x=>`<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)"><span>${esc(fD(x.date))}, ${hmLabel(x.from)}–${hmLabel(x.to)}<span class="muted"> · ${esc(x.note||'Blocked')}</span></span><button class="mini w" data-a="delBlock" data-id="${x.id}">Remove</button></div>`).join('')}</div>`:''}
  </section>`}

function tAppts(){const f=S.t.apFilter;let list=D().appts.slice();if(f==='upcoming')list=list.filter(a=>a.status==='upcoming').sort((a,b)=>a.start-b.start);else if(f==='past')list=list.filter(a=>a.status!=='upcoming').sort((a,b)=>b.start-a.start);else if(f==='due')list=list.filter(a=>due(a)>0).sort((a,b)=>b.start-a.start);
  return `<div class="ttl"><div><h1>Sessions</h1><p>Tap one to label it, record a payment or see intake answers.</p></div><span class="acts"><button class="btn" data-a="newAp" data-from="cal" style="height:42px;font-size:15px">+ New session</button></span></div>
  <div class="seg" role="group" aria-label="Filter" style="align-self:flex-start">${[['upcoming','Upcoming'],['past','Past'],['due','Fees due']].map(([k,l])=>`<button aria-pressed="${f===k}" data-a="set" data-k="t.apFilter" data-v="${k}">${l}</button>`).join('')}</div>
  <section class="panel">${f==='clients'?(()=>{const cl=clientList();return cl.length?cl.map(k=>`<div class="crow"><span style="min-width:0"><b style="font-weight:600">${esc(nm(k.name))}</b>${k.ended?' <span class="pill lb-pur"><i></i>Ended</span>':''}<br><span class="muted" style="font-size:13px">${k.held} session${k.held===1?'':'s'} held · ${k.next?'next '+esc(fD(k.next))+', '+fT(k.next):'nothing booked'}${k.due?' · '+money(k.due)+' due':''}</span></span><span class="acts"><button class="mini pri" data-a="newAp" data-from="cal" data-client="${esc(k.name)}">Book</button></span></div>`).join(''):'<p class="muted" style="margin:0">No clients yet. Tap + Add client.</p>'})()
   :list.length?list.map(arow).join(''):'<p class="muted" style="margin:0">Nothing here.</p>'}</section>`}
function clientList(){const m={};D().appts.forEach(a=>{const c=m[a.name]=m[a.name]||{name:a.name,wa:a.wa,email:a.email,held:0,next:null,due:0,ended:false};if(a.status==='held')c.held++;if(a.status==='upcoming'&&a.start>Date.now()&&(!c.next||a.start<c.next))c.next=a.start;c.due+=due(a);if(a.ended)c.ended=true;if(a.wa&&!c.wa)c.wa=a.wa;if(a.email&&!c.email)c.email=a.email});
  (D().clients||[]).forEach(k=>{if(!m[k.name])m[k.name]={name:k.name,wa:k.wa,email:k.email,held:0,next:null,due:0,ended:false}});return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name))}

function tInsights(){const per=S.t.period;const from=per?T0-per*DAY:0;const inP=D().appts.filter(a=>a.start>=from&&a.start<Date.now());
  const held=inP.filter(a=>a.status==='held');const ns=inP.filter(a=>a.status==='noshow');const lc=inP.filter(a=>a.status==='cancelled'&&a.late);const cx=inP.filter(a=>a.status==='cancelled');
  const total=held.length+ns.length+cx.length;const missed=total?Math.round((ns.length+lc.length)/total*100):0;
  const bc=byClient();const firsts=Object.entries(bc).filter(([n,l])=>{const s=l.slice().sort((a,b)=>a.start-b.start)[0];return s.start>=from&&s.status==='held'});const back=firsts.filter(([n,l])=>l.length>1).length;
  const dueAll=D().appts.reduce((s,a)=>s+due(a),0);const dueN=D().appts.filter(a=>due(a)>0).length;
  const rc={};cx.concat(ns).forEach(a=>{const r=a.reason||'Other';rc[r]=(rc[r]||0)+1});const maxR=Math.max(1,...Object.values(rc));
  const drops=dropoffs();
  const pend=D().appts.filter(needsLabel).sort((a,b)=>b.start-a.start);
  const counts={};LABELS.forEach(l=>counts[l.id]=0);inP.forEach(a=>{const id=labelOf(a);if(id&&!needsLabel(a))counts[id]++});const maxC=Math.max(1,...['completed','terminated','noshow','cancelled'].map(k=>counts[k]));
  const nx=D().appts.filter(a=>a.status==='upcoming'&&a.start>Date.now()&&a.start<Date.now()+7*DAY);const conf=nx.filter(a=>a.label==='confirmed'||a.label==='checkedin').length,nores=nx.filter(a=>a.label==='noresp').length,unl=nx.length-conf-nores;
  const endedC=[...new Set(D().appts.filter(a=>a.ended&&a.start>=from).map(a=>a.name))];const avgEnd=endedC.length?endedC.reduce((x,n)=>x+bc[n].filter(a=>a.status==='held').length,0)/endedC.length:0;
  const lbar=(id,n,max,txt)=>{const l=id?lbl(id):{cls:'lb-grey',name:'No label'};return `<div class="bar" style="grid-template-columns:150px minmax(0,1fr) 28px"><span class="pill ${l.cls}" style="justify-self:start"><i></i>${txt||l.name}</span><span class="track"><i style="width:${max?n/max*100:0}%"></i></span><b style="text-align:right">${n}</b></div>`};
  const needsBlock=pend.length?`<section class="panel sec" style="gap:4px;background:var(--warn-bg)"><h2 class="h2" style="color:var(--warn-ink)">Needs a label · ${pend.length}</h2><p style="margin:0 0 6px;font-size:14px;color:var(--warn-ink)">These sessions have passed. Label them so fees, insights and your training log stay right.</p>
    ${pend.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap"><span><b style="font-weight:600">${esc(nm(a.name))}</b><br><span style="font-size:13px;color:var(--warn-ink)">${esc(fD(a.start))}, ${fT(a.start)} · ${esc(typeOf(a.type).name)}${a.label?' · was '+esc(lbl(a.label).name):''}</span></span><span class="acts"><button class="mini pri" data-a="quickLabel" data-id="${a.id}" data-v="completed">Completed</button><button class="mini w" data-a="quickLabel" data-id="${a.id}" data-v="noshow">No-show</button><button class="mini w" data-a="quickLabel" data-id="${a.id}" data-v="cancelled">Cancelled…</button><button class="mini w" data-a="openAp" data-id="${a.id}">More</button></span></div>`).join('')}</section>`:'';
  const labelsBlock=`<div class="grid2" style="align-items:start"><section class="panel sec"><h2 class="h2">Sessions by label</h2>${['completed','terminated','noshow','cancelled'].map(k=>lbar(k,counts[k],maxC)).join('')}
    <p class="muted" style="margin:0;font-size:14px;line-height:1.5">${endedC.length?`${endedC.length} client${endedC.length===1?'':'s'} ended therapy, after ${avgEnd.toFixed(1)} sessions on average.`:'Label a final session Terminated to see how long clients stay.'}</p></section>
    <section class="panel sec"><h2 class="h2">Next 7 days · ${nx.length} booked</h2>${lbar('confirmed',conf,nx.length)}${lbar('noresp',nores,nx.length)}${lbar(null,unl,nx.length)}
    <p class="muted" style="margin:0;font-size:14px;line-height:1.5">${nores?`${nores} client${nores===1?' hasn’t':'s haven’t'} replied yet. Send a reminder from Messages.`:'Nobody is waiting on a reply.'}</p></section></div>`;
  return `<div class="ttl"><div><h1>Insights</h1><p>How the practice is going, and who may need a check-in.</p></div><div class="seg" role="group" aria-label="Period">${[[30,'30 days'],[90,'90 days'],[0,'All time']].map(([k,l])=>`<button aria-pressed="${per===k}" data-a="period" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="grid4"><div class="tile"><small>Sessions held</small><b>${held.length}</b><small>${(held.reduce((s,a)=>s+a.dur,0)/60).toFixed(1)} client hours</small></div>
  <div class="tile${missed>=10?' warn':''}"><small>Missed rate</small><b>${missed}%</b><small>${ns.length} no-show${ns.length===1?'':'s'}, ${lc.length} late cancel${lc.length===1?'':'s'}</small></div>
  <div class="tile"><small>Came back after a first session</small><b>${firsts.length?Math.round(back/firsts.length*100)+'%':'–'}</b><small>${back} of ${firsts.length} new clients</small></div>
  <div class="tile${dueAll?' warn':''}"><small>Fees due</small><b>${money(dueAll)}</b><small>${dueN} item${dueN===1?'':'s'} · <button class="linkbtn" style="padding:0;font-size:13px" data-a="dueList">See them</button></small></div></div>
  ${needsBlock}${labelsBlock}
  <div class="grid2" style="align-items:start"><section class="panel sec"><h2 class="h2">Why sessions were missed</h2>${Object.keys(rc).length?Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<div class="bar"><span>${esc(r)}</span><span class="track"><i style="width:${n/maxR*100}%"></i></span><b style="text-align:right">${n}</b></div>`).join(''):'<p class="muted" style="margin:0">No cancellations in this period.</p>'}
    <p class="muted" style="margin:0;font-size:14px;line-height:1.5">${cx.length} cancellation${cx.length===1?'':'s'}, ${lc.length} late, ${ns.length} no-show${ns.length===1?'':'s'}. A reason is asked for whenever a session is cancelled.</p></section>
  <section class="panel sec" style="gap:4px"><h2 class="h2">Check in after a first session</h2><p class="muted" style="margin:0 0 6px;font-size:14px">Came once, more than two weeks ago, with nothing booked since.</p>
    ${drops.length?drops.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap"><span><b style="font-weight:600">${esc(nm(d.name))}</b><br><span class="muted" style="font-size:13px">First session ${esc(fD(d.at))} · ${Math.round((T0-dayStart(d.at))/DAY)} days ago</span></span><span class="acts"><button class="mini w" data-a="checkin" data-v="${esc(d.name)}">Send check-in</button><button class="mini w" data-a="checkDone" data-v="${esc(d.name)}">Done</button></span></div>`).join(''):'<p class="muted" style="margin:0">Everyone who came for a first session has been followed up.</p>'}</section></div>`}

function tWaitlist(){const a=S.t.wadd;return `<div class="ttl"><div><h1>Waitlist</h1><p>People waiting for a time. Offer a slot as soon as one opens.</p></div></div>${freedBanner()}

function tLog(){const s=D().settings;const y0=new Date(new Date().getFullYear(),0,1).getTime();const held=D().appts.filter(a=>a.status==='held');
  const ch=held.filter(a=>a.start>=y0).reduce((x,a)=>x+a.dur,0)/60+Number(s.carry||0);const sh=D().supervision.reduce((x,v)=>x+Number(v.hours||0),0);
  const ind=D().supervision.filter(v=>v.kind==='Individual').reduce((x,v)=>x+Number(v.hours),0);const pct=Math.min(100,Math.round(ch/s.target*100));
  const months=[];const now=new Date();for(let i=0;i<6;i++){const m=new Date(now.getFullYear(),now.getMonth()-i,1);const m2=new Date(now.getFullYear(),now.getMonth()-i+1,1);const hs=held.filter(a=>a.start>=m.getTime()&&a.start<m2.getTime());const sv=D().supervision.filter(v=>v.date>=m.getTime()&&v.date<m2.getTime());months.push({label:m.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),n:hs.length,h:hs.reduce((x,a)=>x+a.dur,0)/60,s:sv.reduce((x,v)=>x+Number(v.hours),0),c:new Set(hs.map(a=>a.name)).size})}
  const v=S.t.sv;if(!v.date)v.date=new Date(T0).toISOString().slice(0,10);
  return `<div class="ttl"><div><h1>Training log</h1><p>Client hours fill in from held sessions. Add supervision as it happens.</p></div><button class="btn" data-a="csv" style="height:42px;font-size:15px">Export for supervisor</button></div>
  <div class="grid4"><div class="tile"><small>Client hours</small><b>${ch.toFixed(1)}</b><small>Includes ${s.carry} carried over</small></div><div class="tile"><small>Supervision hours</small><b>${sh.toFixed(1)}</b><small>${ind.toFixed(1)} individual logged here</small></div>
  <div class="tile"><small>Ratio</small><b>1 : ${sh?Math.round(ch/sh):'–'}</b><small>Supervision to client hours</small></div><div class="tile"><small>Towards ${s.target} client hours</small><b>${pct}%</b><span class="track" style="margin-top:8px"><i style="width:${pct}%"></i></span></div></div>
  ${(()=>{const fl=D().appts.filter(a=>a.sup&&!a.supDone).sort((a,b)=>a.start-b.start);const dn=D().appts.filter(a=>a.supDone).length;
    return `<section class="panel sec" style="gap:4px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 class="h2">To take to supervision · ${fl.length}</h2><span class="muted" style="font-size:13px">${dn} discussed so far · initials only</span></div>
    ${fl.length?fl.map(a=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap"><span style="min-width:0;flex:1"><b style="font-weight:600">${esc(initials(a.name))}</b> <span class="muted" style="font-size:13px">· ${esc(fD(a.start))} · ${esc(typeOf(a.type).name)}</span><br><span style="font-size:14px;line-height:1.45">${a.supNote?esc(a.supNote):'<span class="muted">No note yet</span>'}</span></span><span class="acts"><button class="mini pri" data-a="supDone" data-id="${a.id}">Discussed</button><button class="mini w" data-a="openAp" data-id="${a.id}">Open</button></span></div>`).join('')
      :'<p class="muted" style="margin:4px 0 0;font-size:14px">Nothing tagged. Open any session and tap <b>Take to supervision</b>.</p>'}</section>`})()}
  <div class="grid2" style="align-items:start"><section class="panel sec"><h2 class="h2">By month</h2><div class="xs"><table class="t"><thead><tr><th>Month</th><th>Sessions</th><th>Client hrs</th><th>Supervision</th><th>Clients</th></tr></thead><tbody>${months.map(m=>`<tr><td>${esc(m.label)}</td><td>${m.n}</td><td>${m.h.toFixed(1)}</td><td>${m.s}</td><td>${m.c}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="margin:0;font-size:13px">Cancelled and missed sessions are not counted. Client names never appear in the export.</p></section>

    ${field('svs','Supervisor','t.sv.sup',{req:false,ph:'Name or group'})}${chips('t.sv.kind',['Individual','Group','Peer'],'Type')}${field('svn','Note, optional','t.sv.note',{req:false,ph:'What you covered'})}${(()=>{const fl=D().appts.filter(a=>a.sup&&!a.supDone);return fl.length?`<div class="f" role="group" aria-label="Cases discussed"><span class="ql">Cases discussed</span>${fl.map(a=>`<label class="check" style="font-size:14px"><input type="checkbox" data-f="t.svc.${a.id}" ${S.t.svc[a.id]?'checked':''}>${esc(initials(a.name))} · ${esc(fD(a.start))}</label>`).join('')}</div>`:''})()}<div><button class="mini pri" data-a="addSv">Save entry</button></div>
    <div>${D().supervision.slice().sort((a,b)=>b.date-a.date).slice(0,5).map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px"><span>${esc(fD(x.date))} · ${esc(x.sup)}<span class="muted"> · ${esc(x.kind)}</span></span><b>${x.hours} h</b></div>`).join('')}</div></section></div>
  <p class="muted" style="margin:0;font-size:13px">Hour targets differ by course and licensing body. Change yours in Profile.</p>`}

  ${(()=>{const pr=D().appts.filter(a=>due(a)>0).sort((a,b)=>b.start-a.start).slice(0,6);if(!pr.length)return '';const auto=D().connect.wa.on&&D().connect.wa.auto;
    return `<section class="panel sec"><h2 class="h2">Payment requests · ${pr.length}</h2><p class="muted" style="margin:-6px 0 0;font-size:14px">${auto?'Sent automatically when you label a session Completed.':'Each message carries a UPI link with the amount filled in.'} Mark it paid once the money shows in your account.</p>
    ${pr.map(a=>`<div class="sec" style="gap:8px;padding:12px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(nm(a.name))} · ${money(due(a))}</b><span class="muted" style="font-size:13px">${esc(fD(a.start))}</span></div><div class="msg" id="pay_${a.id}">${esc(payText(a))}</div><span class="acts"><a class="mini pri" href="https://wa.me/?text=${encodeURIComponent(payText(a))}" target="_blank" rel="noopener">Open in WhatsApp</a><button class="mini w" data-a="copy" data-src="pay_${a.id}">Copy</button><button class="mini w" data-a="apPaid" data-id="${a.id}">Mark paid</button></span></div>`).join('')}</section>`})()}
  <section class="panel sec"><h2 class="h2">Share your open times</h2><p class="muted" style="margin:-6px 0 0;font-size:14px">For someone who asks “when are you free?” on WhatsApp.</p><div class="msg" id="opentimes">${esc(openTxt)}</div><span class="acts"><button class="mini pri" data-a="copy" data-src="opentimes">Copy</button><a class="mini w" href="https://wa.me/?text=${encodeURIComponent(openTxt)}" target="_blank" rel="noopener">Open in WhatsApp</a></span></section>`}

function tPayments(){const all=D().appts,now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const when=a=>(a.pay&&a.pay.at)||a.start;
  const recs=all.filter(a=>a.paid).sort((x,y)=>when(y)-when(x));const q=String(S.t.payQ||'').trim().toLowerCase();
  const shown=q?recs.filter(a=>((a.pay&&a.pay.utr)||'').includes(q.replace(/\s/g,''))||a.name.toLowerCase().includes(q)):recs;
  const month=recs.filter(a=>when(a)>=m0).reduce((s,a)=>s+payAmt(a),0);const dueL=all.filter(a=>due(a)>0).sort((a,b)=>b.start-a.start);
  const missing=recs.filter(a=>!a.pay||(!a.pay.utr&&a.pay.method!=='Cash'));
  return `<div class="ttl"><div><h1>Payments</h1><p>Every fee, with the UPI transaction ID that proves it was paid.</p></div><button class="btn2" data-a="paycsv" style="height:42px;font-size:15px">Export CSV</button></div>
  <div class="grid4"><div class="tile"><small>Received in ${now.toLocaleDateString('en-IN',{month:'long'})}</small><b>${money(month)}</b><small>${recs.filter(a=>when(a)>=m0).length} payments</small></div>
  <div class="tile${dueL.length?' warn':''}"><small>Due now</small><b>${money(dueL.reduce((s,a)=>s+due(a),0))}</b><small>${dueL.length} unpaid</small></div>
  <div class="tile${missing.length?' warn':''}"><small>Missing a reference</small><b>${missing.length}</b><small>Paid, but no UTR recorded</small></div>
