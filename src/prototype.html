    if(v==='cancelled'){if(x.status!=='cancelled'){if(x.status!=='upcoming')applyLabel(x,null);S.modal={kind:'ap',id:x.id,cancel:true,reason:'',show:false,pick:false}}else if(S.modal)S.modal.pick=false;break}
    applyLabel(x,v);if(S.modal)S.modal.pick=false;save();toast(v?'Labelled '+lbl(v).name+(v==='completed'||v==='terminated'?'. Fee added to dues.':v==='noshow'?'. Full fee due.':''):'Label removed');break}
  case 'calMenu':S.t.calMenu=!S.t.calMenu;break;
  case 'calView':S.t.cal=ds.v;break;
  case 'calDay':S.t.cal='day';S.t.calDate=Number(ds.v);break;
  case 'calNav':{const v=Number(ds.v),cur=S.t.calDate||T0,view=S.t.cal||'week';if(!v){S.t.calDate=T0;break}if(view==='day')S.t.calDate=addDays(cur,v);else if(view==='week')S.t.calDate=addDays(cur,7*v);else{const x=new Date(cur);x.setDate(1);x.setMonth(x.getMonth()+v);S.t.calDate=dayStart(x.getTime())}break}
  case 'confirmed':{const x=d.appts.find(y=>y.id===ds.id);x.isNew=false;x.label='confirmed';save();toast('Marked confirmed');break}
  case 'hrAdd':{const wd=ds.wd;const l=d.hours[wd]=d.hours[wd]||[];const last=l[l.length-1];l.push(last?[last[1]>'19:00'?'19:00':last[1],'21:00']:['10:00','13:00']);save();break}
  case 'hrDel':d.hours[ds.wd].splice(Number(ds.i),1);save();break;
  case 'qAdd':d.intake.push({id:'q'+Date.now(),label:'New question',type:'text',req:false});save();break;
  case 'qDel':d.intake.splice(Number(ds.i),1);save();break;
  case 'qMove':{const i=Number(ds.i),j=i+Number(ds.v);if(j<0||j>=d.intake.length)return;const t=d.intake[i];d.intake[i]=d.intake[j];d.intake[j]=t;save();break}
  case 'copy':{const src=document.getElementById(ds.src);if(!src)return;const txt=src.value!=null&&src.tagName==='TEXTAREA'?src.value:src.textContent;
    try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>{selectEl(src);toast('Selected. Press Ctrl or ⌘ + C to copy.')})}catch(e){selectEl(src);toast('Selected. Press Ctrl or ⌘ + C to copy.')}return}
  case 'tourBack':{const m=S.modal;if(m&&m.step>0){m.step--;m.err={}}break}
  case 'tourSkipPw':{const m=S.modal;m.pw='';m.pw2='';m.err={};m.step++;break}
  case 'tourSkip':{d.tourDone=Date.now();S.modal=null;save();toast('You can take the tutorial again in Settings.');break}
  case 'tourHours':{d.tourDone=Date.now();S.modal=null;S.t.tab='hours';save();toast('Set your hours here. The tutorial is under Settings if you want it again.');break}
  case 'tourReplay':{S.modal={kind:'tour',step:0,err:{}};break}
  case 'tourNext':{const m=S.modal,steps=tourSteps(),k=steps[m.step],e={};
    if(k==='password'){if(m.busy)return;const a=String(m.pw||''),b=String(m.pw2||'');if(a.length<10)e.pw='Use at least 10 characters';else if(a!==b)e.pw2='The two passwords don’t match';
      if(Object.keys(e).length){m.err=e;break}
      m.busy=true;m.err={};SB.auth.updateUser({password:a}).then(({error})=>{m.busy=false;if(error){m.err={pw:'Could not set the password. Try a different one, or sign in again.'}}else{m.pw='';m.pw2='';m.step++;toast('Password set')}render()}).catch(()=>{m.busy=false;m.err={pw:'We could not reach the server. Try again.'};render()});break}
    if(k==='you'){const nmv=String(P().name||'').trim();if(!nmv||nmv==='Your name')e.name='Enter your name';}
    if(k==='fees'){['first','follow','reduced'].forEach(id=>{const i=tourTypeIx(id);if(i<0)return;if(id==='reduced'&&m.sliding==='No')return;const f=D().types[i].fee;if(f===''||!(Number(f)>=0))e[id]='Enter an amount, or 0 if it is free'});
      if(!Object.keys(e).length){const ri=tourTypeIx('reduced');if(m.sliding==='No'&&ri>=0)m.rbak=D().types.splice(ri,1)[0]}}
    if(Object.keys(e).length){m.err=e;break}
    m.err={};
    if(m.step>=steps.length-1){d.tourDone=Date.now();S.modal=null;save();toast('All set. Welcome to Practice.');break}
    m.step++;save();break}
  case 'close':S.modal=null;break;
  case 'closeOv':S.modal=null;break;
  default:return}
  render()}
function selectEl(el){if(el.select){el.focus();el.select();return}const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}
function cancelAppt(x,reason,when){const s=D().settings;const late=x.start-(when||Date.now())<s.cancelWindow*36e5;x.status='cancelled';x.reason=reason;x.late=late;x.lateFee=late?Math.round(x.fee*s.latePct/100):0;x.paid=false;x.isNew=false;x.cancelledAt=when||Date.now();if(x.start>Date.now())S.t.freed={start:x.start,dur:x.dur,by:x.name,late}}
function focusErr(){const el=document.querySelector('#stage .f.bad .in, #stage .f.bad .chip, #stage .err');if(el){el.scrollIntoView({block:'center'});if(el.focus)el.focus()}}

document.addEventListener('click',e=>{const ov=e.target.closest('[data-a="closeOv"]');const inSheet=e.target.closest('[data-stop]');const el=e.target.closest('[data-a]');
  if(!el)return;if(el.dataset.a==='closeOv'&&inSheet)return;if(el.tagName==='A')return;e.preventDefault();act(el.dataset.a,el)});
function onField(e,commit){const el=e.target;const p=el.dataset&&el.dataset.f;if(!p)return;let v;if(el.type==='checkbox')v=el.checked;else if(el.dataset.list)v=el.value.split(',').map(x=>x.trim()).filter(Boolean);else if(el.dataset.num||(el.type==='number'&&p.startsWith('data.')))v=el.value===''?'':Number(el.value);else v=el.value;
  setPath(p,v);if(p.startsWith('c.')){const k=p.split('.').pop();if(S.c.err[k]){delete S.c.err[k]}}
  if(p.startsWith('data.'))save();
  if(commit&&!rendering&&(el.dataset.live||el.type==='checkbox'||el.tagName==='SELECT')&&!(el.type==='checkbox'&&p==='c.agree'))render()}
document.addEventListener('input',e=>{onField(e,false);const t=e.target;if(t.id==='findq'){const r=document.getElementById('findres');if(r)r.innerHTML=findResults(t.value)}if(t.id==='peopleq'){const r=document.getElementById('peoplelist');if(r)r.innerHTML=peopleRows(t.value)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='impfile'&&t.files&&t.files[0]&&S.modal){const r=new FileReader();r.onload=()=>{S.modal.text=String(r.result||'');render()};r.readAsText(t.files[0]);return}onField(e,true)});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset&&e.target.dataset.form==='login')act('login',e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

/* hash routing */
function setHash(){if(LIVE)return;const h=S.view+'-'+S.device;if(location.hash!=='#'+h){try{history.replaceState(null,'','#'+h)}catch(e){location.hash=h}}}
function readHash(){if(LIVE){S.view=LIVE;S.device=window.innerWidth<700?'phone':'desktop';return}const m=/^#(client|therapist)-(desktop|phone)$/.exec(location.hash);if(m){S.view=m[1];S.device=m[2]}else{S.device=window.innerWidth<640?'phone':'desktop'}}
window.addEventListener('hashchange',()=>{readHash();S.modal=null;render()});
if(LIVE){document.body.classList.add('live');document.getElementById('livebar').hidden=!!SB||!!SLUG;if(LIVE==='therapist'&&!SB)document.getElementById('livereset').hidden=false;
  window.addEventListener('resize',()=>{const dv=window.innerWidth<700?'phone':'desktop';if(dv!==S.device){S.device=dv;S.modal=null;render()}});
  window.addEventListener('storage',e=>{if(SB||SLUG||e.key!==KEY||!e.newValue)return;try{const p=JSON.parse(e.newValue);if(p&&p.data){S.data=p.data;ensure(S.data);const tg=(document.activeElement||{}).tagName||'';if(!S.modal&&!/INPUT|TEXTAREA|SELECT/.test(tg))render()}}catch(_){}})}
if(SB){S.auth=false;
  SB.auth.getSession().then(({data})=>{S.sbReady=true;S.auth=!!(data&&data.session);
    if(S.auth&&FROM_LINK){S.auth=false;S.login.mode='setpw'}
    if(S.auth)sbLoad();else render()});
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.auth){S.auth=false;S.data=ensure(blankData());S.dbReady=false;S.uid=null;render()}});
  window.addEventListener('pagehide',()=>{sbFlush()});
  setInterval(sbInbox,45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sbInbox()});
}
if(SLUG)pubLoad();
readHash();render();
// Update check: a page left open (or a Home Screen icon) keeps running the code it loaded. Look for a newer build
// now and then; reload when that is safe, otherwise show a bar so nothing the person is typing is lost.
function updBusy(){try{if(S.dirty)return true;if(document.querySelector('.modal,[role="dialog"]'))return true;if(S.c&&S.c.step&&!['intro','booked'].includes(S.c.step))return true}catch(e){}return false}
async function chkVersion(){if(!window.APP_V||document.hidden)return;
  try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j.v||j.v===window.APP_V)return;
    if(!updBusy()){location.reload();return}
    if(document.getElementById('updbar'))return;const d=document.createElement('div');d.id='updbar';d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:var(--ink,#1b1d1c);color:var(--bg,#fff);padding:12px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;font:15px/1.3 inherit;box-shadow:0 4px 18px rgba(0,0,0,.35)';
    d.innerHTML='<span>A newer version is ready.</span><button type="button" style="font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;border:0;cursor:pointer">Update now</button>';
    d.querySelector('button').onclick=()=>location.reload();document.body.appendChild(d)}catch(e){}}
setInterval(chkVersion,180000);document.addEventListener('visibilitychange',chkVersion);window.addEventListener('pageshow',e=>{if(e.persisted)chkVersion()});
window.__chkVersion=chkVersion;

})();
